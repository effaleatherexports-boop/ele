<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>E-L-E Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

        tr:nth-child(even) {
            background: #f7f7f7;
        }

        .button {
            display: inline-block;
            padding: 9px 14px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .add-button {
            background: #222;
            padding: 12px 20px;
            font-weight: bold;
        }

        .edit-button {
            background: #555;
        }

        .delete-button {
            background: #990000;
        }

        .logout {
            background: #222;
        }

        .action-form {
            display: inline;
        }

        @media (max-width: 700px) {

            .container {
                width: 95%;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }

        }

    </style>

</head>

<body>


<div class="header">

    <h1>E-L-E</h1>

    <p>Admin Dashboard</p>

</div>


<div class="container">


<div class="box">

    <h2>
        Articles in Database
    </h2>


    <a
        href="/admin/add"
        class="button add-button"
    >
        + ADD NEW ARTICLE
    </a>
    <a
    href="/admin/orders"
    class="button add-button"
>
    📋 ORDER HISTORY
</a>


    <table>

        <tr>

            <th>
                Article Code
            </th>

            <th>
                Article Name
            </th>

            <th>
                Production Days
            </th>

            <th>
                Actions
            </th>

        </tr>


        {% for article in articles %}

        <tr>

            <td>
                {{ article["code"] }}
            </td>

            <td>
                {{ article["name"] }}
            </td>

            <td>
                {{ article["production_days"] }}
                Days
            </td>

            <td>

                <a
                    href="/admin/edit/{{ article['id'] }}"
                    class="button edit-button"
                >
                    EDIT
                </a>


                <form
                    method="POST"
                    action="/admin/delete/{{ article['id'] }}"
                    class="action-form"
                    onsubmit="return confirm('Are you sure you want to delete this article?');"
                >

                    <button
                        type="submit"
                        class="button delete-button"
                    >
                        DELETE
                    </button>

                </form>

            </td>

        </tr>

        {% endfor %}

    </table>

</div>


<div class="box">

    <a
        href="/admin/logout"
        class="button logout"
    >
        LOGOUT
    </a>

</div>


</div>

</body>

</html>
