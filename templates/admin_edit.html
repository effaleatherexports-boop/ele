<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>E-L-E Edit Article</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        h2 {
            margin-top: 0;
        }

        .process-title {
            margin-top: 30px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #222;
            text-decoration: none;
        }

    </style>

</head>

<body>


<div class="header">

    <h1>E-L-E</h1>

    <p>Edit Article</p>

</div>


<div class="container">

<div class="box">

<form method="POST">


<h2>
    Article Details
</h2>


<div class="form-group">

    <label>
        Article Code
    </label>

    <input
        type="text"
        name="code"
        value="{{ article['code'] }}"
        required
    >

</div>


<div class="form-group">

    <label>
        Article Name
    </label>

    <input
        type="text"
        name="name"
        value="{{ article['name'] }}"
        required
    >

</div>


<div class="form-group">

    <label>
        Production Days
    </label>

    <input
        type="number"
        name="production_days"
        min="1"
        value="{{ article['production_days'] }}"
        required
    >

</div>


<h2 class="process-title">
    Process Schedule
</h2>


{% for process in processes %}

<div class="form-group">

    <label>
        {{ process['process_name'] }}
    </label>

    <input
        type="number"
        name="{{ process['process_name'] }}"
        min="0"
        value="{{ process['days_before_delivery'] }}"
        required
    >

</div>

{% endfor %}


<button type="submit">
    UPDATE ARTICLE
</button>


<a
    href="/admin"
    class="back"
>
    ← Back to Admin Dashboard
</a>


</form>

</div>

</div>

</body>

</html>
